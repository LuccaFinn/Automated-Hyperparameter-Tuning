#Diese TOML haben wir für GridSearch und RandomSearch benutzt, um die einzelnen Ergebnisse getrennt zu haben, auch wenn es doppelt gemoppelt ist.
[Model]
algorithm = "svm"
task = "classification"   # "classification" oder "regression"

[Data]
input_start = 0
input_end = 6
target_column = 7
test_size = 0.2
random_state = 42

[SVM]
random_search_iterations = 1000

[SVM.InitialParameters]
C = 1.0
kernel = "rbf"
gamma = "scale"

[SVM.SearchSpace]
C = [0.01, 100.0]
kernel = ["linear", "rbf", "poly", "sigmoid"]
gamma = ["scale", "auto"]

[SVM.TunedParameters]
C = 0.0
kernel = ""
gamma = ""

[SVM.GridSearchParameters]
C = 0.0
kernel = ""
gamma = ""

[SVM.RandomSearchParameters]
C = 0.0
kernel = ""
gamma = ""
